name: Build & Test (GrayCode Desktop)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支连续推送自动取消在跑的旧构建，避免排队浪费
concurrency:
  group: graycode-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            electron-app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix electron-app

      # frontend 的类型检查已含在其 build 脚本（vue-tsc --noEmit && vite build）内，
      # 由下方 build:all 一并执行；这里若再单独跑 vue-tsc 会让每次 CI 对全仓重复
      # 两遍 vue-tsc（frontend/package.json 的 build 脚本不属于本工作流可改范围，
      # 故在 workflow 层面去重，保留 root tsc + electron tsc）
      - name: Typecheck (backend + electron)
        run: |
          npx tsc -p ./ --noEmit
          npm --prefix electron-app run typecheck

      - name: Unit tests (backend jest + frontend vitest)
        run: |
          npm test
          npm --prefix frontend test

      - name: Build frontend + main process
        run: npm run build:all
        working-directory: electron-app

      - name: Backend E2E tests
        run: npm run e2e
        working-directory: electron-app
        env:
          GRAYCODE_CI: '1'

      - name: UI smoke test
        run: npm run smoke
        working-directory: electron-app
        env:
          GRAYCODE_CI: '1'

      - name: Package (electron-builder)
        run: npx electron-builder --win
        working-directory: electron-app
        env:
          GRAYCODE_CI: '1'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graycode-desktop-windows
          path: |
            electron-app/release/*.exe
            electron-app/release/*.zip
          if-no-files-found: ignore
          retention-days: 14
