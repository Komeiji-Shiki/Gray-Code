name: CI

# PR 与 main 分支推送的质量门禁（E-01）：
# 平台服务、桌面、客户端与扩展的类型检查、测试和 i18n 校验，
# 与本地 `npm run ci` 使用同一入口。
# nightly（schedule）与 release（打 tag）由各自 workflow 负责，本 workflow 只做日常 PR/main 验证。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # 前端有独立 package.json（非 workspaces），需单独安装其依赖
          npm --prefix frontend ci --no-audit --no-fund

      - name: Typecheck & test
        run: npm run ci

  windows-desktop:
    # 原生依赖固定使用 VS 2022 工具链；换用新版 Windows 镜像前，先确认 Node 自带的 node-gyp 能识别其中的 Visual Studio。
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # PowerShell 多行脚本只保留最后一个外部命令的退出码，独立步骤才能保留安装失败。
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Build Windows desktop
        run: npm run build:desktop
      - name: Verify Windows process and language service lifecycle
        run: >-
          npx jest --config jest.platform.config.cjs --runInBand --runTestsByPath
          packages/core/tests/workspaceProcesses.test.ts
          packages/core/tests/workspaceProcessTools.test.ts
          packages/core/tests/languageServices.test.ts
          packages/core/tests/commonLanguageServices.test.ts
      - name: Verify real MCP fixtures
        run: npx jest --config jest.backend.config.js --runInBand --runTestsByPath backend/__tests__/mcp/McpClient.test.ts
      - name: Verify isolated desktop workflows
        run: npx electron scripts/smoke-desktop.cjs
      - name: Preserve desktop verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-desktop-check-${{ github.sha }}
          path: |
            .tmp/desktop-smoke-*/report.json
            .tmp/desktop-smoke-*/failure.json
            .tmp/desktop-smoke-*/*.png
          if-no-files-found: ignore
          # 仅收集隔离夹具的报告和截图；.tmp 目录需要显式允许隐藏文件。
          include-hidden-files: true
          retention-days: 7
