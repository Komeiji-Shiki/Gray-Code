name: CI

# PR 与 main 分支推送的质量门禁（E-01）：
# 平台服务、桌面、客户端与扩展的类型检查、测试和 i18n 校验，
# 与本地 `npm run ci` 使用同一入口。
# nightly（schedule）与 release（打 tag）由各自 workflow 负责，本 workflow 只做日常 PR/main 验证。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # 前端有独立 package.json（非 workspaces），需单独安装其依赖
          npm --prefix frontend ci --no-audit --no-fund

      - name: Typecheck & test
        run: npm run ci
