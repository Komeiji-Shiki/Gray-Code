name: Release vsix

# 打 v* tag 时自动构建 vsix 并发布到 GitHub Releases：
#   git tag v1.4.5 && git push origin v1.4.5
# 产物文件名 graycode-<tag>.vsix（如 graycode-v1.4.5.vsix），
# 扩展内置的「自动更新」功能从 Releases 的 vsix 资产下载安装。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # 前端有独立 package.json（非 workspaces），需单独安装其依赖
          npm --prefix frontend ci

      - name: Typecheck & test
        run: npm run ci

      - name: Package vsix
        # vsce package 会先执行 vscode:prepublish（即 npm run build），无需显式 Build 步骤
        run: npx vsce package --out "graycode-${{ github.ref_name }}.vsix"

      - name: Extract release notes from CHANGELOG
        # 默认只携带当前版本小节；通过 GITHUB_TOKEN 查询最新已发布 release，
        # 检测到中间版本未发布（被跳过）时自动补带跳过版本的内容
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" > release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "graycode-${{ github.ref_name }}.vsix"
          body_path: release-notes.md
