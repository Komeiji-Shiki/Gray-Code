name: Release vsix

# 打 v* tag 时自动构建 vsix 并发布到 GitHub Releases：
#   git tag v1.4.5 && git push origin v1.4.5
# 产物文件名 graycode-<tag>.vsix（如 graycode-v1.4.5.vsix），
# 扩展内置的「自动更新」功能从 Releases 的 vsix 资产下载安装。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # 前端有独立 package.json（非 workspaces），需单独安装其依赖
          npm --prefix frontend ci

      - name: Build
        run: npm run build

      - name: Package vsix
        run: npx vsce package --out "graycode-${{ github.ref_name }}.vsix"

      - name: Extract release notes from CHANGELOG
        # 从 CHANGELOG.md 提取当前版本与上一个版本两个小节（如 1.4.5 + 1.4.4）
        # 作为 release notes 正文，替代 GitHub 自动生成的 commit 分类简介
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "graycode-${{ github.ref_name }}.vsix"
          body_path: release-notes.md
