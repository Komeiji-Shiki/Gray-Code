name: Nightly Build

# 每两天打包默认分支的最新 Windows 桌面版，成功发布后只保留本次 nightly。
# 固定下载入口：https://github.com/Komeiji-Shiki/Gray-Code/releases/tag/nightly
on:
  schedule:
    - cron: '17 2 * * *' # 北京时间 10:17；下方按连续日期隔天执行，跨月也保持两天间隔。
  workflow_dispatch:

permissions:
  contents: read

# 发布与清理必须串行完成，避免新任务取消正在上传的版本。
concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.schedule.outputs.build }}
    steps:
      - name: Resolve two-day schedule
        id: schedule
        uses: actions/github-script@v9
        with:
          script: |
            // 日历 cron 的 */2 会在月初重置；以 2026-10-01 为起点计算连续天数。
            const day = Math.floor(Date.now() / 86_400_000);
            const firstDay = Math.floor(Date.UTC(2026, 9, 1) / 86_400_000);
            const build = context.eventName === 'workflow_dispatch' || (day - firstDay) % 2 === 0;
            core.setOutput('build', String(build));
            if (!build) core.info('今天不在两天一次的构建周期内，跳过打包。');

  package:
    needs: schedule
    if: needs.schedule.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Restore installer tools
        run: dotnet tool restore
      - name: Validate application before packaging
        run: npm run ci
      - name: Package Windows application
        run: npm run package:desktop
      - name: Package Windows installer
        run: npm run package:installer

      - name: Record packaged build identity
        id: identity
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const { stdout } = await exec.getExecOutput('git', ['rev-parse', 'HEAD']);
            const commit = stdout.trim();
            const timestamp = new Date().toISOString();
            const date = timestamp.slice(0, 10).replaceAll('-', '');
            core.setOutput('version', version);
            core.setOutput('commit', commit);
            core.setOutput('timestamp', timestamp);
            core.setOutput('prefix', `GrayCode-nightly-${date}-${commit.slice(0, 12)}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`);

      - name: Prepare downloadable packages
        env:
          NIGHTLY_PREFIX: ${{ steps.identity.outputs.prefix }}
        run: |
          New-Item -ItemType Directory -Path 'release/nightly' -Force | Out-Null
          Compress-Archive -LiteralPath 'release/desktop/GrayCode-win32-x64' -DestinationPath "release/nightly/$env:NIGHTLY_PREFIX-win32-x64.zip"
          Copy-Item -LiteralPath 'release/desktop-installer/GrayCode-win-x64-Setup.exe' -Destination "release/nightly/$env:NIGHTLY_PREFIX-win-x64-Setup.exe"
          # 更新清单引用原始文件名，把整组更新产物放在同一 ZIP 内，保留内部名称。
          $updateFiles = @(Get-ChildItem -LiteralPath 'release/desktop-installer' -File | Where-Object { $_.Extension -ne '.exe' } | Select-Object -ExpandProperty FullName)
          Compress-Archive -LiteralPath $updateFiles -DestinationPath "release/nightly/$env:NIGHTLY_PREFIX-win-x64-update.zip"
          Compress-Archive -Path 'release/source/*' -DestinationPath "release/nightly/$env:NIGHTLY_PREFIX-source.zip"

      - name: Preserve packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GrayCode-Nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/nightly/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest nightly and remove older builds
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ steps.identity.outputs.version }}
          NIGHTLY_COMMIT: ${{ steps.identity.outputs.commit }}
          NIGHTLY_TIMESTAMP: ${{ steps.identity.outputs.timestamp }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const repo = context.repo;
            const directory = path.resolve('release/nightly');
            const files = fs.readdirSync(directory);
            const commit = process.env.NIGHTLY_COMMIT;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag: 'nightly' }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({ ...repo, tag_name: 'nightly',
                target_commitish: commit, name: 'GrayCode Nightly', draft: true, prerelease: true, make_latest: 'false' }));
            }

            // 每次使用新的附件名，上传失败时旧版本仍可下载；全部上传完成后才更新发布信息与清理。
            await exec.exec('gh', ['release', 'upload', 'nightly', ...files.map(file => path.join(directory, file)),
              '--repo', `${repo.owner}/${repo.repo}`]);
            try {
              await github.rest.git.updateRef({ ...repo, ref: 'tags/nightly', sha: commit, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...repo, ref: 'refs/tags/nightly', sha: commit });
            }
            const body = [
              'Windows x64 桌面版，每两天自动构建。',
              `构建时间：${process.env.NIGHTLY_TIMESTAMP}`,
              `应用版本：v${process.env.NIGHTLY_VERSION}`,
              `源码提交：\`${commit}\``,
              '',
              '附件包括便携包、安装器、完整离线更新包与对应源码包。',
              '离线更新包解压后，保持更新清单与包文件位于同一目录。',
              '此页面只保留最近一次成功构建；下一次构建失败时继续提供本次下载。',
            ].join('\n');
            await github.rest.repos.updateRelease({ ...repo, release_id: release.id,
              name: `v${process.env.NIGHTLY_VERSION} Nightly (${process.env.NIGHTLY_TIMESTAMP.slice(0, 10)} / ${commit.slice(0, 12)})`,
              body, draft: false, prerelease: true, make_latest: 'false' });

            const currentFiles = new Set(files);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id, per_page: 100 });
            for (const asset of assets) {
              if (!currentFiles.has(asset.name)) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
            }

            // 清理旧扩展 workflow 留下的日期归档；正式版本与其他标签不属于 nightly 清理范围。
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            for (const oldRelease of releases) {
              if (!/^nightly-\d{8}$/.test(oldRelease.tag_name)) continue;
              await github.rest.repos.deleteRelease({ ...repo, release_id: oldRelease.id });
              try {
                await github.rest.git.deleteRef({ ...repo, ref: `tags/${oldRelease.tag_name}` });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { ...repo, per_page: 100 });
            const currentArtifact = `GrayCode-Nightly-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (const artifact of artifacts) {
              if (artifact.name === currentArtifact) continue;
              if (artifact.name === 'graycode-nightly' || /^GrayCode-Nightly-\d+-\d+$/.test(artifact.name)) {
                await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
              }
            }
            await core.summary.addHeading('Windows 桌面 Nightly')
              .addLink('下载最近一次成功构建', `https://github.com/${repo.owner}/${repo.repo}/releases/tag/nightly`)
              .addRaw(`\n\n版本：v${process.env.NIGHTLY_VERSION}\n\n源码提交：${commit}\n\n已清理旧 nightly 附件、日期归档与 Actions 构建附件。\n`)
              .write();
