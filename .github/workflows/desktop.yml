name: Build Windows desktop

# 仅创建可下载的构建附件；公开发行与签名凭据由维护者单独配置。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    # 与日常桌面验收使用相同的 VS 2022 原生编译工具链。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Restore installer tools
        run: dotnet tool restore
      - name: Validate application before packaging
        run: npm run ci
      - name: Package Windows application
        run: npm run package:desktop
      - name: Package Windows installer
        run: npm run package:installer
      - uses: actions/upload-artifact@v4
        with:
          name: GrayCode-Windows-${{ github.sha }}
          path: |
            release/desktop/GrayCode-win32-x64/**
            release/desktop-installer/**
            release/source/*.tar.gz
            release/source/*.sha256
            release/source/source-package.json
          if-no-files-found: error
          retention-days: 14
