<!--
  boot-splash.html - 首帧启动画面（注入 frontend/dist/index.html 的 <body> 开头）

  作用：渲染进程的 Vue 应用（index.js ~1.3MB）需要数百 ms 解析/挂载，期间窗口
  只有纯色背景；本片段是纯静态 HTML+CSS（无 JS），窗口第一帧即显示与 Splash.vue
  完全同款、同节奏的动画，Vue 挂载后由 Splash.vue 无缝接管。

  接管机制：patch-dist.mjs 同时注入 boot-splash.js，在 <head> 执行时记录
  window.__GC_BOOT_TS = Date.now()；Splash.vue 挂载时计算 elapsed 并以
  calc(var(--gc-boot-offset) + Xs) 负延迟续播动画（SMIL begin 同样减去 offset），
  随后移除本元素——动画时间轴无跳变。

  一致性：本文件与 frontend/src/components/Splash.vue 的时间轴/路径必须严格一致，
  bootSplash.test.ts（frontend vitest）会比对两者 d= 路径与时间常量，防止漂移。
  与 Splash.vue 的差异仅限：id 前缀（gc-boot-，避免 mpath href 重复 id 解析错位）、
  CSS 选择器加 #gc-boot 前缀、vscode CSS 变量替换为系统配色 fallback（theme.css
  在 did-finish-load 后才注入，首帧还没有 --vscode-* 变量）。
-->
<style>
/* 关闭启动画面（appearance.splashEnabled=false）时首帧不显示静态画面：
   boot-splash.js 读取 localStorage 标记 gc-splash-disabled 后在 <html> 上加
   gc-no-splash 类（head 脚本，早于 body 解析），此规则使 #gc-boot 直接不渲染 */
html.gc-no-splash #gc-boot {
  display: none;
}
#gc-boot {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  --gc-boot-bg: #ffffff;
  --gc-boot-fg: #1f1f1f;
  --gc-boot-blue: #0050b3;
  background: var(--gc-boot-bg);
  color: var(--gc-boot-fg);
}
@media (prefers-color-scheme: dark) {
  #gc-boot {
    --gc-boot-bg: #1e1e1e;
    --gc-boot-fg: #e5e5e5;
    --gc-boot-blue: #3794ff;
  }
}

/* 蓝图点阵背景 + 晕影：极淡网格点，径向遮罩聚焦中心 */
#gc-boot::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(currentColor 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 72%);
  mask-image: radial-gradient(ellipse at center, black 25%, transparent 72%);
  opacity: 0;
  animation: gc-boot-bg-in 0.75s ease 0.2s both;
}
@keyframes gc-boot-bg-in {
  to {
    opacity: 0.05;
  }
}

#gc-boot .gc-boot-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 24px;
  animation: gc-boot-float 4s ease-in-out 0.3s infinite;
}
@keyframes gc-boot-float {
  50% {
    transform: translateY(-2.5px);
  }
}

#gc-boot .girl {
  display: block;
  color: var(--gc-boot-fg);
  opacity: 0.95;
  --ink-hair: color-mix(in srgb, currentColor 92%, var(--gc-boot-bg));
  --ink-cap: color-mix(in srgb, currentColor 45%, var(--gc-boot-bg));
  --ink-body: color-mix(in srgb, currentColor 30%, var(--gc-boot-bg));
  --paper: var(--gc-boot-bg);
  animation: gc-boot-settle 0.45s ease-out 1.35s both;
}
@keyframes gc-boot-settle {
  0% {
    opacity: 0.82;
  }
  40% {
    opacity: 1;
    filter: drop-shadow(0 0 10px currentColor);
  }
  100% {
    opacity: 0.95;
    filter: none;
  }
}

#gc-boot .fills path {
  opacity: 0;
  animation: gc-boot-ink-in 0.35s ease-out both;
}
#gc-boot .fill-body,
#gc-boot .fill-hair,
#gc-boot .fill-face {
  animation-delay: 1.15s;
}
#gc-boot .fill-cap {
  animation-delay: 1.25s;
}
@keyframes gc-boot-ink-in {
  to {
    opacity: 1;
  }
}

#gc-boot .draw-cap,
#gc-boot .draw-body {
  fill: none;
  stroke: currentColor;
  stroke-width: 26;
  stroke-linejoin: round;
  stroke-linecap: round;
}
#gc-boot .draw-cap {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation:
    gc-boot-draw 0.55s ease-out 0.05s both,
    gc-boot-retire 0.35s ease-out 1.15s both;
}
#gc-boot .draw-body {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation:
    gc-boot-draw 0.8s ease-out 0.4s both,
    gc-boot-retire 0.35s ease-out 1.15s both;
}
@keyframes gc-boot-draw {
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes gc-boot-retire {
  to {
    opacity: 0.3;
    stroke-width: 10;
  }
}

#gc-boot .pen {
  opacity: 0;
  filter: drop-shadow(0 0 8px currentColor);
}
#gc-boot .pen-cap {
  animation: gc-boot-pen 0.55s linear 0.05s both;
}
#gc-boot .pen-body {
  animation: gc-boot-pen 0.8s linear 0.4s both;
}
@keyframes gc-boot-pen {
  0% {
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  88% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

#gc-boot .title {
  margin: 0;
  font-size: 26px;
  letter-spacing: 0.08em;
  opacity: 0;
  animation: gc-boot-title-in 0.55s ease-out 0.55s both;
}
@keyframes gc-boot-title-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
#gc-boot .t-gray {
  font-weight: 600;
}
#gc-boot .t-code {
  font-weight: 300;
  color: var(--gc-boot-fg);
  opacity: 0.7;
}
#gc-boot .caret {
  color: var(--gc-boot-blue);
  font-weight: 300;
  animation: gc-boot-caret 1.0s steps(1, end) 1.0s infinite;
}
@keyframes gc-boot-caret {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}

#gc-boot .subtitle {
  margin: -6px 0 0;
  font-size: 10px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: var(--gc-boot-fg);
  opacity: 0;
  animation: gc-boot-fade-up 0.5s ease-out 0.65s both;
}
@keyframes gc-boot-fade-up {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 0.8;
    transform: none;
  }
}

#gc-boot .gray-line {
  display: flex;
  gap: 5px;
  margin-top: 4px;
  opacity: 0;
  animation: gc-boot-fade-up 0.5s ease-out 0.65s both;
}
#gc-boot .bit {
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
  opacity: 0.12;
}
#gc-boot .b0 {
  animation: gc-boot-g0 1.0s linear 0.65s infinite;
}
#gc-boot .b1 {
  animation: gc-boot-g1 1.0s linear 0.65s infinite;
}
#gc-boot .b2 {
  animation: gc-boot-g2 1.0s linear 0.65s infinite;
}
@keyframes gc-boot-g0 {
  0%,
  24.9% {
    opacity: 1;
  }
  25%,
  49.9% {
    opacity: 0.12;
  }
  50%,
  74.9% {
    opacity: 1;
  }
  75%,
  100% {
    opacity: 0.12;
  }
}
@keyframes gc-boot-g1 {
  0%,
  12.4% {
    opacity: 0.12;
  }
  12.5%,
  62.4% {
    opacity: 1;
  }
  62.5%,
  100% {
    opacity: 0.12;
  }
}
@keyframes gc-boot-g2 {
  0%,
  37.4% {
    opacity: 0.12;
  }
  37.5%,
  87.4% {
    opacity: 1;
  }
  87.5%,
  100% {
    opacity: 0.12;
  }
}

@media (prefers-reduced-motion: reduce) {
  #gc-boot .pen {
    display: none;
  }
  #gc-boot::before,
  #gc-boot .gc-boot-inner,
  #gc-boot .draw-cap,
  #gc-boot .draw-body,
  #gc-boot .title,
  #gc-boot .subtitle,
  #gc-boot .caret,
  #gc-boot .bit,
  #gc-boot .girl,
  #gc-boot .fills path,
  #gc-boot .gray-line {
    animation: none;
  }
  #gc-boot .draw-cap,
  #gc-boot .draw-body {
    stroke-dashoffset: 0;
    opacity: 0.3;
    stroke-width: 10;
  }
  #gc-boot .fills path {
    opacity: 1;
  }
  #gc-boot .gray-line {
    opacity: 1;
  }
  #gc-boot .title {
    opacity: 1;
  }
  #gc-boot .subtitle {
    opacity: 0.8;
  }
  #gc-boot .bit {
    opacity: 0.9;
  }
}
</style>
